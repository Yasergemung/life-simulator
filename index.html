<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Life Simulator - Your decisions. Your life."
    >

    <title>Life Simulator</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         START SCREEN
    ====================================== -->

    <main
        id="startScreen"
        class="screen"
    >

        <div class="logo">

            LIFE
            <span>SIMULATOR</span>

        </div>


        <p class="subtitle">
            Your decisions. Your life.
        </p>


        <button
            id="startBtn"
            class="main-btn"
        >

            ▶ START LIFE

        </button>

    </main>



    <!-- =====================================
         CHARACTER CREATION
    ====================================== -->

    <main
        id="creationScreen"
        class="screen hidden"
    >

        <div class="panel">

            <h1>
                Create Your Character
            </h1>


            <p>
                Your life begins here.
            </p>


            <!-- NAME -->

            <input
                type="text"
                id="playerName"
                placeholder="Enter your name"
                maxlength="20"
                autocomplete="off"
            >


            <!-- AGE -->

            <input
                type="number"
                id="playerAge"
                placeholder="Enter your age"
                min="13"
                max="100"
            >


            <!-- GOAL -->

            <select id="playerGoal">

                <option value="">
                    Choose your main goal
                </option>

                <option value="developer">
                    💻 Become a Developer
                </option>

                <option value="athlete">
                    ⚽ Become an Athlete
                </option>

                <option value="creator">
                    🎥 Become a Content Creator
                </option>

                <option value="business">
                    💰 Build a Business
                </option>

            </select>


            <button
                id="createBtn"
                class="main-btn"
            >

                CREATE CHARACTER

            </button>

        </div>

    </main>



    <!-- =====================================
         GAME SCREEN
    ====================================== -->

    <main
        id="gameScreen"
        class="hidden"
    >


        <!-- =================================
             HEADER
        ================================== -->

        <header class="game-header">


            <div>

                <small>
                    PLAYER
                </small>


                <h2 id="displayName">
                    PLAYER
                </h2>

            </div>



            <div class="level">

                LEVEL
                <span id="level">
                    1
                </span>

            </div>


        </header>



        <!-- =================================
             REAL WORLD TIME
        ================================== -->

        <section class="real-time">


            <!-- REAL DATE -->

            <div>

                <span id="realDate">
                    Loading...
                </span>

            </div>



            <!-- CLOCK -->

            <div class="clock">

                <span id="realTime">
                    00:00:00
                </span>

            </div>



            <!-- MORNING / AFTERNOON / EVENING / NIGHT -->

            <div id="timePeriod">

                🌙 Night

            </div>


        </section>



        <!-- =================================
             PLAYER STATS
        ================================== -->

        <section class="stats">


            <!-- INTELLIGENCE -->

            <div class="stat">

                <span>
                    🧠 Intelligence
                </span>


                <strong id="intelligence">
                    50
                </strong>


                <div class="bar">

                    <div
                        id="intelligenceBar"
                        style="width: 50%;"
                    ></div>

                </div>

            </div>



            <!-- SKILLS -->

            <div class="stat">

                <span>
                    💻 Skills
                </span>


                <strong id="skills">
                    50
                </strong>


                <div class="bar">

                    <div
                        id="skillsBar"
                        style="width: 50%;"
                    ></div>

                </div>

            </div>



            <!-- FITNESS -->

            <div class="stat">

                <span>
                    💪 Fitness
                </span>


                <strong id="fitness">
                    50
                </strong>


                <div class="bar">

                    <div
                        id="fitnessBar"
                        style="width: 50%;"
                    ></div>

                </div>

            </div>



            <!-- HAPPINESS -->

            <div class="stat">

                <span>
                    😊 Happiness
                </span>


                <strong id="happiness">
                    50
                </strong>


                <div class="bar">

                    <div
                        id="happinessBar"
                        style="width: 50%;"
                    ></div>

                </div>

            </div>



            <!-- MONEY -->

            <div class="stat">

                <span>
                    💰 Money
                </span>


                <strong id="money">
                    50
                </strong>


                <div class="bar">

                    <div
                        id="moneyBar"
                        style="width: 50%;"
                    ></div>

                </div>

            </div>


        </section>



        <!-- =================================
             DAY PANEL
        ================================== -->

        <section class="day-panel">


            <!-- CURRENT DAY -->

            <div class="day-number">

                DAY

                <span id="day">
                    1
                </span>

            </div>



            <h1>
                What will you do today?
            </h1>


            <p>
                Your choices will shape your future.
            </p>



            <!-- =================================
                 ACTIONS
            ================================== -->

            <div class="actions">


                <!-- STUDY -->

                <button
                    class="action"
                    data-action="study"
                >

                    📚


                    <span>
                        Study
                    </span>


                    <small>
                        +10 Intelligence
                    </small>

                </button>



                <!-- CODING -->

                <button
                    class="action"
                    data-action="coding"
                >

                    💻


                    <span>
                        Learn Coding
                    </span>


                    <small>
                        +10 Skills
                    </small>

                </button>



                <!-- FOOTBALL -->

                <button
                    class="action"
                    data-action="football"
                >

                    ⚽


                    <span>
                        Football
                    </span>


                    <small>
                        +10 Fitness
                    </small>

                </button>



                <!-- GAMING -->

                <button
                    class="action"
                    data-action="gaming"
                >

                    🎮


                    <span>
                        Gaming
                    </span>


                    <small>
                        +10 Happiness
                    </small>

                </button>


            </div>


        </section>



        <!-- =================================
             XP SYSTEM
        ================================== -->

        <section class="xp-panel">


            <span>
                ⭐ XP
            </span>


            <strong>

                <span id="xp">
                    0
                </span>

                / 100

            </strong>


            <div class="xp-bar">

                <div
                    id="xpBar"
                    style="width: 0%;"
                ></div>

            </div>


        </section>



        <!-- =================================
             NEW LIFE BUTTON
        ================================== -->

        <div
            style="
                text-align:center;
                margin-top:25px;
            "
        >

            <button
                class="main-btn"
                onclick="resetGame()"
                style="
                    margin-top:0;
                    background:#151515;
                    border-color:#444;
                "
            >

                🔄 NEW LIFE

            </button>

        </div>


    </main>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
